services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dinsat
      POSTGRES_USER: dinsat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinsat -d dinsat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
